name: ClangTidyDiffReview

# You can be more specific, but it currently only works on pull requests
on: [pull_request]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    # Optionally generate compile_commands.json

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - uses: ZedThree/clang-tidy-review@v0.20.1
      id: review
      with:
        split_workflow: true
        build_dir: build
        # Leave both empty so that clang-tidy uses the closest .clang-tidy to
        # each file (the root config, plus the test-directory configs that
        # inherit from it). Setting config_file passes --config-file, and
        # setting clang_tidy_checks passes --checks; either disables
        # per-directory lookup.
        config_file: ''
        clang_tidy_checks: ''
        max_comments: '100'
        exclude: "third_party/*"
        # US_BUILD_TESTING=ON puts the test targets in compile_commands.json,
        # so test sources are analysed with their real include paths (gtest,
        # gmock, private framework headers) instead of failing with
        # "file not found".
        cmake_command: |
          cmake --version && \
          git config --global --add safe.directory "$GITHUB_WORKSPACE" && \
          cmake . -DCMAKE_EXPORT_COMPILE_COMMANDS=on -DUS_BUILD_TESTING=ON
          
    # Uploads an artefact containing clang_fixes.json
    - uses: ZedThree/clang-tidy-review/upload@v0.20.1
      id: upload-review
    # If there are any comments, fail the check
    - if: steps.review.outputs.total_comments > 0
      run: exit 1
